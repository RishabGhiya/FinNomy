<svg viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-mistakes-svg" style="width: 100%; max-width: 580px; height: auto;">
  <!-- Background Glow & Diagnostic Accents -->
  <circle cx="380" cy="240" r="160" fill="#FEF3C7" fill-opacity="0.5"/>
  <circle cx="200" cy="300" r="130" fill="#EFF6FF" fill-opacity="0.6"/>
  
  <!-- Opportunity Cost Trajectory Curve -->
  <path d="M 80 200 Q 220 220 340 320 T 520 420" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <circle cx="520" cy="420" r="8" fill="#F59E0B"/>
  <circle cx="520" cy="420" r="16" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Main Wealth Leak Audit Card -->
  <g transform="translate(80, 160)">
    <rect width="220" height="185" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 12px 24px rgba(15, 23, 42, 0.08))"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#FEF3C7"/>
    <text x="34" y="38" fill="#D97706" font-size="16" font-weight="bold" text-anchor="middle">⚠️</text>
    <text x="60" y="28" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RECOVERABLE WEALTH</text>
    <text x="60" y="48" fill="#D97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">₹23.80 Lakhs</text>
    <line x1="16" y1="68" x2="204" y2="68" stroke="#F1F5F9" stroke-width="1.5"/>
    
    <!-- Breakdown Items -->
    <text x="16" y="90" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Small Leaks + Delay Cost</text>
    <text x="16" y="106" fill="#64748B" font-family="'Inter', sans-serif" font-size="9.5">Compounded 15-Year Impact</text>
    
    <!-- Indicator Bar -->
    <rect x="16" y="120" width="188" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="16" y="120" width="140" height="8" rx="4" fill="#F59E0B"/>
    
    <!-- Action Tag -->
    <rect x="16" y="138" width="188" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="28" y="158" fill="#00B37E" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">▲ Save ₹8,500/mo in SIP</text>
  </g>

  <!-- Floating Badge 1: Lazy Money Trap -->
  <g transform="translate(340, 80)">
    <rect width="190" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 10px 20px rgba(15, 23, 42, 0.08))"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="30" y="35" fill="#0B63D8" font-size="15" text-anchor="middle">💤</text>
    <text x="54" y="28" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">Lazy Money Audit</text>
    <text x="54" y="44" fill="#0B63D8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Idle Cash vs. Index Growth</text>
  </g>

  <!-- Floating Badge 2: The "No-Cost" Trap -->
  <g transform="translate(330, 280)">
    <rect width="190" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 10px 20px rgba(15, 23, 42, 0.08))"/>
    <circle cx="28" cy="29" r="14" fill="#ECFDF5"/>
    <text x="28" y="34" fill="#00B37E" font-size="13" text-anchor="middle">🏷️</text>
    <text x="50" y="25" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">No-Cost EMI Trap</text>
    <text x="50" y="41" fill="#00B37E" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Foregone Discounts Exposed</text>
  </g>

  <!-- Leak Coin Element -->
  <g transform="translate(270, 110)">
    <circle cx="18" cy="18" r="18" fill="#0B63D8"/>
    <text x="18" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">₹</text>
  </g>
</svg>
