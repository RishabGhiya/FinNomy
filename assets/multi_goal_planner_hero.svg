<svg viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-multigoal-svg" style="width: 100%; max-width: 580px; height: auto;">
  <!-- Background Glow & Radial Constellation -->
  <circle cx="380" cy="240" r="160" fill="#EFF6FF" fill-opacity="0.6"/>
  <circle cx="200" cy="300" r="130" fill="#ECFDF5" fill-opacity="0.7"/>
  
  <!-- Interconnected Milestone Trajectory Lines -->
  <path d="M 90 380 Q 220 360 300 240 T 510 120" stroke="#0B63D8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M 90 380 Q 260 280 430 260" stroke="#00B37E" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Main Consolidated Roadmap Card -->
  <g transform="translate(80, 160)">
    <rect width="220" height="195" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 12px 24px rgba(15, 23, 42, 0.08))"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#ECFDF5"/>
    <text x="34" y="38" fill="#00B37E" font-size="16" font-weight="bold" text-anchor="middle">🎯</text>
    <text x="60" y="28" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PORTFOLIO HEALTH</text>
    <text x="60" y="48" fill="#00B37E" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">100% On Track</text>
    <line x1="16" y1="68" x2="204" y2="68" stroke="#F1F5F9" stroke-width="1.5"/>
    
    <!-- Mini Goal Rows -->
    <text x="16" y="90" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">🎓 Education: ₹44.8 L</text>
    <rect x="16" y="98" width="188" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="16" y="98" width="160" height="5" rx="2.5" fill="#0B63D8"/>

    <text x="16" y="122" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">🏡 Home Down Payment: ₹26.8 L</text>
    <rect x="16" y="130" width="188" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="16" y="130" width="140" height="5" rx="2.5" fill="#00B37E"/>

    <!-- Monthly Summary Tag -->
    <rect x="16" y="148" width="188" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="168" fill="#0B63D8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Total SIP: ₹80,000 / mo</text>
  </g>

  <!-- Floating Badge 1: Multiple Goals Integrated -->
  <g transform="translate(340, 80)">
    <rect width="190" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 10px 20px rgba(15, 23, 42, 0.08))"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="30" y="35" fill="#0B63D8" font-size="15" text-anchor="middle">🗺️</text>
    <text x="54" y="28" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">Unified Roadmap</text>
    <text x="54" y="44" fill="#0B63D8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Zero Goal Conflicts</text>
  </g>

  <!-- Floating Badge 2: Cash-Flow Balance -->
  <g transform="translate(330, 280)">
    <rect width="190" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 10px 20px rgba(15, 23, 42, 0.08))"/>
    <circle cx="28" cy="29" r="14" fill="#ECFDF5"/>
    <text x="28" y="34" fill="#00B37E" font-size="13" text-anchor="middle">⚖️</text>
    <text x="50" y="25" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Cash Flow Balance</text>
    <text x="50" y="41" fill="#00B37E" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Surplus vs. Living Costs</text>
  </g>

  <!-- Goal Pin Elements -->
  <g transform="translate(260, 110)">
    <circle cx="18" cy="18" r="18" fill="#0B63D8"/>
    <text x="18" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">₹</text>
  </g>
</svg>
